<!DOCTYPE html>
<html lang="pl" data-theme="glikokids">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – GlikoKids</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style/child.css">
</head>
<body class="min-h-screen">

  <div id="confetti-container" aria-hidden="true"></div>

  <nav class="c-nav">
    <div class="c-nav-inner">
      <a href="/dziecko" class="c-brand">GlikoKids</a>
      <button onclick="openPinModal()" class="c-parent-btn">
        <i class="fas fa-user-shield"></i> Panel rodzica
      </button>
    </div>
  </nav>

  <div id="pin-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:24px;padding:2rem 2rem 1.5rem;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;animation:popIn .25s ease">
      <div style="font-size:3rem;margin-bottom:0.5rem">🔐</div>
      <h2 style="font-family:'Baloo 2',sans-serif;font-size:1.5rem;color:#3D9285;margin-bottom:0.25rem">Panel rodzica</h2>
      <p style="color:#666;font-size:0.88rem;margin-bottom:1.25rem">Rodzicu, podaj swój 4-cyfrowy PIN</p>
      <div id="pin-inputs" style="display:flex;gap:10px;justify-content:center;margin-bottom:1rem">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" style="width:52px;height:58px;font-size:1.6rem;text-align:center;border:2px solid #ddd;border-radius:12px;outline:none;font-weight:700;transition:border-color .2s">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" style="width:52px;height:58px;font-size:1.6rem;text-align:center;border:2px solid #ddd;border-radius:12px;outline:none;font-weight:700;transition:border-color .2s">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" style="width:52px;height:58px;font-size:1.6rem;text-align:center;border:2px solid #ddd;border-radius:12px;outline:none;font-weight:700;transition:border-color .2s">
        <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" pattern="[0-9]" style="width:52px;height:58px;font-size:1.6rem;text-align:center;border:2px solid #ddd;border-radius:12px;outline:none;font-weight:700;transition:border-color .2s">
      </div>
      <p id="pin-error" style="color:#e74c3c;font-size:0.82rem;min-height:1.2em;margin-bottom:0.75rem"></p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="closePinModal()" style="padding:0.5rem 1.4rem;border-radius:2rem;border:2px solid #ddd;background:#fff;color:#666;font-weight:700;cursor:pointer;font-size:0.9rem">Anuluj</button>
        <button onclick="submitPin()" style="padding:0.5rem 1.4rem;border-radius:2rem;border:none;background:linear-gradient(135deg,#3D9285,#5BAD8C);color:#fff;font-weight:700;cursor:pointer;font-size:0.9rem">Wejdź</button>
      </div>
    </div>
  </div>

  <div class="c-wrap q-main">

    <div id="start-menu" style="text-align: center; padding: 40px 20px;">
        <h2 style="margin-bottom: 20px; font-family: 'Baloo 2', sans-serif; font-size: 2rem; color: #3D9285;">Wybierz poziom trudności:</h2>
        
        <button onclick="startQuiz('kids')" style="padding: 15px 30px; margin: 10px; font-size: 18px; border-radius: 10px; background-color: #ffd166; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            🧸 Dla młodszych
        </button>
        
        <button onclick="startQuiz('normal')" style="padding: 15px 30px; margin: 10px; font-size: 18px; border-radius: 10px; background-color: #06d6a0; color: white; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            🧠 Dla starszych
        </button>
    </div>

    <div id="quiz-screen" style="display: none;">
      <div class="q-card">

        <div class="q-card-head">
          <div class="q-head-row">
            <span class="q-counter" id="q-counter">Pytanie 1 / 10</span>
            <span class="q-score-pill">⭐ <span id="score-live">0</span></span>
          </div>
          <div class="q-track">
            <div class="progress-bar-quiz" id="progress-bar" style="width:0%"></div>
          </div>
        </div>

        <div class="q-card-body">
          <div class="question-text" id="question-text"></div>
          <div id="answers-container" class="q-answers"></div>
          <div class="feedback-text" id="feedback-text"></div>
          <div class="q-next-wrap">
            <button class="q-next-btn" id="next-btn" style="display:none" onclick="nextQuestion()">
              Następne <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div id="results-screen" style="display:none">
      <div class="q-results-card">
        <div class="q-result-emoji" id="result-emoji"></div>
        <div class="score-display" id="result-score"></div>
        <div class="star-row" id="result-stars"></div>
        <p class="q-result-msg" id="result-msg"></p>
        <p class="q-result-sub" id="result-sub"></p>
        <div class="q-result-btns">
          <button class="q-btn-primary" onclick="location.reload()">
            <i class="fas fa-redo"></i> Jeszcze raz
          </button>
          <a href="/dziecko" class="q-btn-ghost">← Menu</a>
        </div>
      </div>
    </div>

    <div class="q-back-wrap">
      <a href="/dziecko" class="q-back-link" id="back-btn" style="display: none;">
        <i class="fas fa-chevron-left"></i> Powrót do menu
      </a>
    </div>

  </div>

  <script>const CHILD_ID = {{ user_id }};</script>
  <script src="/js/quiz.js"></script>
  <script>
    function openPinModal() {
      const m = document.getElementById('pin-modal');
      m.style.display = 'flex';
      document.getElementById('pin-error').textContent = '';
      document.querySelectorAll('.pin-digit').forEach(function(el) { el.value = ''; el.style.borderColor = '#ddd'; });
      document.querySelectorAll('.pin-digit')[0].focus();
    }
    function closePinModal() { document.getElementById('pin-modal').style.display = 'none'; }
    document.getElementById('pin-modal').addEventListener('click', function(e) { if (e.target === this) closePinModal(); });
    document.querySelectorAll('.pin-digit').forEach(function(input, idx, all) {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !input.value && idx > 0) all[idx - 1].focus();
        if (e.key === 'Enter') submitPin();
      });
      input.addEventListener('input', function() {
        input.value = input.value.replace(/[^0-9]/g, '').slice(-1);
        if (input.value && idx < all.length - 1) all[idx + 1].focus();
        input.style.borderColor = input.value ? '#3D9285' : '#ddd';
      });
    });
    async function submitPin() {
      const pin = Array.from(document.querySelectorAll('.pin-digit')).map(function(d) { return d.value; }).join('');
      const errEl = document.getElementById('pin-error');
      if (pin.length !== 4) { errEl.textContent = 'Wpisz wszystkie 4 cyfry.'; return; }
      try {
        const res = await fetch('/api/verify-pin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pin: pin}) });
        const data = await res.json();
        if (data.ok) { window.location.href = '/rodzic'; }
        else {
          errEl.textContent = data.error || 'Nieprawidłowy PIN.';
          document.querySelectorAll('.pin-digit').forEach(function(d) { d.value = ''; d.style.borderColor = '#e74c3c'; });
          document.querySelectorAll('.pin-digit')[0].focus();
        }
      } catch(e) { errEl.textContent = 'Błąd połączenia. Spróbuj ponownie.'; }
    }
  </script>

</body>
</html>
