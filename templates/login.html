<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie – GlikoKids</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-primary:  #3D9285;
      --amber:      #D98C2A;
      --amber-pale: #FEF4D8;
      --cream:      #FAF6EE;
      --warm-dark:  #28200F;
      --warm-mid:   #6B5344;
      --warm-light: #B09070;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(61,146,133,0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(217,140,42,0.08) 0%, transparent 45%);
    }

    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(61,146,133,0.12), 0 2px 8px rgba(40,32,15,0.06);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-gem {
      display: inline-block;
      width: 14px; height: 14px;
      background: var(--amber);
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .brand h1 {
      font-family: 'Lora', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--p-primary);
      margin: 0;
      display: inline;
    }
    .brand-sub {
      display: block;
      color: var(--warm-light);
      font-size: 0.85rem;
      font-style: italic;
      margin-top: 0.4rem;
    }

    .form-label {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--warm-mid);
      margin-bottom: 0.4rem;
    }
    .form-control {
      border: 1.5px solid #C8DDD9;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem 0.9rem;
      color: var(--warm-dark);
      transition: border-color .15s, box-shadow .15s;
    }
    .form-control:focus {
      border-color: var(--p-primary);
      box-shadow: 0 0 0 3px rgba(61,146,133,0.15);
      outline: none;
    }

    .btn-login {
      background: var(--p-primary);
      border: none;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.7rem;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: background .18s, box-shadow .18s;
      box-shadow: 0 3px 10px rgba(61,146,133,0.28);
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: #2F7268;
      box-shadow: 0 5px 14px rgba(61,146,133,0.36);
    }

    .divider {
      border: none;
      border-top: 1px solid #EEE8E0;
      margin: 1.5rem 0;
    }

    .register-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--warm-mid);
    }
    .register-link a {
      color: var(--p-primary);
      font-weight: 700;
      text-decoration: none;
    }
    .register-link a:hover { text-decoration: underline; }

    .alert {
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      margin-bottom: 1rem;
    }
    .alert-danger  { background: #FDECEA; color: #8A2020; }
    .alert-success { background: #E8F5F0; color: #2F7268; }
    .alert-warning { background: var(--amber-pale); color: #7A5010; }
    .btn-close { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div>
        <span class="brand-gem"></span>
        <h1>GlikoKids</h1>
      </div>
      <span class="brand-sub">Zaloguj się do panelu rodzica</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label"><i class="fas fa-envelope me-1" style="color:var(--warm-light)"></i> Adres e-mail</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="rodzic@example.com" required
               value="{{ request.form.get('email', '') }}">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label"><i class="fas fa-lock me-1" style="color:var(--warm-light)"></i> Hasło</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt me-2"></i> Zaloguj się
      </button>
    </form>

    <hr class="divider">
    <p class="register-link">
      Nie masz jeszcze konta?
      <a href="{{ url_for('register') }}">Zarejestruj się</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
